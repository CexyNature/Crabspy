[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crabspy-web"
version = "0.1.0"
description = "Crabspy local web UI (FastAPI + Jinja2 + HTMX)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "crabspy>=0.2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
]
postgres = [
  "psycopg[binary]>=3.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crabspy_web*"]
