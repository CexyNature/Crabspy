<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}{{ title | default("Crabspy") }}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', path='css/app.css') }}" />
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/">Crabspy</a>
      <nav class="site-nav">
        <a href="/">Home</a>
        <a href="/media/">Media</a>
        <a href="/settings/database">Database</a>
      </nav>
    </header>
    <main id="main" class="site-main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer">
      <p class="muted">CrabSpy &mdash; built with FastAPI, Jinja2 &amp; HTMX · <a href="https://github.com/CexyNature/Crabspy" target="_blank" rel="noopener">Source on GitHub</a></p>
    </footer>
    <script src="{{ url_for('static', path='js/app.js') }}" defer></script>
  </body>
</html>
