# Build and publish the Crabspy Web image.
#
# - Builds on PRs (no push) so we catch Dockerfile regressions early.
# - Pushes images on:
#   - branch `rebuild` (tagged as `rebuild`, plus a short sha tag)
#   - git tag `v*` (semver tags, plus `latest` on default branch tags)
#
# Registries:
# - GHCR: always (ghcr.io/<owner>/crabspy-web)
# - Docker Hub: optional, if DOCKERHUB_USERNAME + DOCKERHUB_TOKEN secrets are set
#   (publishes to docker.io/<DOCKERHUB_USERNAME>/crabspy-web)

name: Build and Push Docker Image

on:
  push:
    branches: [rebuild]
    tags: ["v*"]
  pull_request:
    branches: [rebuild]
  workflow_dispatch:

env:
  REGISTRY_GHCR: ghcr.io

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image namespace (Docker requires lowercase)
        id: lc
        run: |
          owner_lc="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner_lc=${owner_lc}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (optional)
        if: github.event_name != 'pull_request' && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_GHCR }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags for all listed images)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_GHCR }}/${{ steps.lc.outputs.owner_lc }}/crabspy-web
            ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' && format('{0}/crabspy-web', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=rebuild-,format=short,enable=${{ github.ref_type == 'branch' && github.ref_name == 'rebuild' }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image (GHCR tag only)
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY_GHCR }}/${{ steps.lc.outputs.owner_lc }}/crabspy-web:rebuild"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then IMG="${{ env.REGISTRY_GHCR }}/${{ steps.lc.outputs.owner_lc }}/crabspy-web:latest"; fi
          docker run -d --rm --name crabspy_web_smoke -p 18000:8000 "${IMG}"
          for i in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:18000/api/health" >/dev/null; then
              echo "health ok"
              docker stop crabspy_web_smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "health check failed"
          docker logs crabspy_web_smoke || true
          docker stop crabspy_web_smoke || true
          exit 1
