name: CI

on: [push, pull_request]

jobs:
  test-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install crabspy + crabspy-web (dev)
        run: |
          pip install -e ".[dev]"
          pip install -e "apps/web[dev]"

      - name: Run tests
        run: pytest tests/crabspy tests/web -q
