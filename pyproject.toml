[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crabspy"
version = "0.2.0"
description = "Crab biology computer vision library (rebuild); see docs/crabspy-library-and-domain-plan.md"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
  "numpy>=1.24",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# Heavy / optional pipelines (legacy scoop-feed, skimage, etc.)
legacy = [
  "matplotlib>=3.7",
  "pandas>=2.0",
  "scikit-image>=0.22",
  "scikit-learn>=1.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["crabspy*"]
